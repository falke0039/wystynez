<meta name="description" content="5 августа (суббота) в посёлке Краснолесье состоится ежегодный праздник &#171;Соседи-2023&#187;. Это праздник гостеприимства и дружеского общения людей, живущих рядом, влюблённых в свою землю. В этом году, как и обычно, на территории Виштынецкого экомузея планируются ремесленные и творческие мастерские, ярмарка местных продуктов и концерт народных коллективов (в доме культуры посёлка). Отдельной площадкой будет представлен уже многим известный проект &#171;Вкусы Виштынецкой возвышенности&#187;, в котором участвуют многие местные жители и шефповара ресторанов Калининграда и области. Начало праздника в 12:00 в музее по адресу: Калининградская область, пос. Краснолесье, ул. Школьная &#8211; 5а. Всех приглашаем! Вход свободный. Фото: Юлия Алексеева  ">
