name: Restore and audit SiteCraft site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[site-restore]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe deterministic repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          if p.exists():
            s=p.read_text(encoding='utf-8')
            s=s.replace('charset=utf-8>','charset=utf-8">')
            s=s.replace('<a href="./p0008.htm" class="t1"><b>Архив наших событи</b></a><b>й</b>','<a href="./p0008.htm" class="t1"><b>Архив наших событий</b></a>')
            p.write_text(s,encoding='utf-8')
          PY
          touch .nojekyll
      - name: Audit restored archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          pages=sorted(p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.htm','.html'})
          files={p.as_posix() for p in root.rglob('*') if p.is_file()}
          menu=['О нас','Наши услуги','Экспозиция','Мы на карте мира','Архив наших событий','Наши друзья','Природа','Культура','История','Гостям']
          hits={x:[] for x in menu}; old=[]; missing=[]; charset=[]
          for p in pages:
            try: text=p.read_text(encoding='utf-8')
            except UnicodeDecodeError: charset.append((p.as_posix(),'не UTF-8')); continue
            for x in menu:
              if x in text: hits[x].append(p.as_posix())
            if re.search(r'charset=utf-8(?!["\'])',text,re.I): charset.append((p.as_posix(),'незакрытый charset'))
            for u in re.findall(r'''(?:href|src)\s*=\s*["']([^"']+)["']''',text,re.I):
              if 'wystynez.ru' in u or 'rominten.wystynez.ru' in u: old.append((p.as_posix(),u))
              if u.startswith(('http://','https://','mailto:','javascript:','#','//')): continue
              t=u.split('#',1)[0].split('?',1)[0]
              if t and not t.endswith('/') and (p.parent/t).as_posix().lstrip('./') not in files: missing.append((p.as_posix(),u))
          out=['# Аудит восстановленного SiteCraft-архива','',f'HTML-страниц: **{len(pages)}**','', '## Пункты общего меню']
          out += [f'- **{x}** — {len(v)} страниц' for x,v in hits.items()]
          out += ['', '## Проблемы кодировки и HTML'] + ([f'- `{p}` — {r}' for p,r in charset[:300]] or ['- Не обнаружены'])
          out += ['', '## Старые абсолютные ссылки'] + ([f'- `{p}` → `{u}`' for p,u in old[:300]] or ['- Не обнаружены'])
          out += ['', '## Возможные отсутствующие локальные ссылки'] + ([f'- `{p}` → `{u}`' for p,u in missing[:300]] or ['- Не обнаружены'])
          Path('SITE-AUDIT.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit repairs and audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .nojekyll SITE-AUDIT.md
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m '[site-restore] Safe homepage repair and audit'; git push; fi
