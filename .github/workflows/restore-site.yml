name: Restore SiteCraft site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[site-restore]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore original homepage from live site
        shell: bash
        run: |
          set -e
          curl -L --fail --silent --show-error 'https://www.wystynez.ru/' -o index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          raw = p.read_bytes()
          # The original SiteCraft page is served in Windows-1251.
          # Decode bytes correctly before converting the copy to UTF-8.
          if re.search(br'charset\s*=\s*["\']?windows-1251', raw, re.I):
              s = raw.decode('cp1251')
          else:
              s = raw.decode('utf-8')
          for old in (
              'http://www.wystynez.ru/', 'https://www.wystynez.ru/',
              'http://wystynez.ru/', 'https://wystynez.ru/'
          ):
              s = s.replace(old, './')
          s = re.sub(r'charset\s*=\s*["\']?windows-1251["\']?', 'charset=utf-8', s, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Repair HTML encoding and old absolute links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.htm', '.html'}:
                  continue
              if str(p) == 'index.html':
                  continue
              raw = p.read_bytes()
              try:
                  # Prefer the encoding explicitly declared by the old page.
                  if re.search(br'charset\s*=\s*["\']?windows-1251', raw, re.I):
                      s = raw.decode('cp1251')
                  else:
                      s = raw.decode('utf-8')
              except UnicodeDecodeError:
                  try:
                      s = raw.decode('cp1251')
                  except UnicodeDecodeError:
                      continue

              s = re.sub(r'charset\s*=\s*["\']?windows-1251["\']?', 'charset=utf-8', s, flags=re.I)
              for old in (
                  'http://www.wystynez.ru/', 'https://www.wystynez.ru/',
                  'http://wystynez.ru/', 'https://wystynez.ru/'
              ):
                  s = s.replace(old, './')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Disable Jekyll processing
        shell: bash
        run: touch .nojekyll

      - name: Commit restored site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m '[site-restore] Restore SiteCraft site'
            git push
          fi
